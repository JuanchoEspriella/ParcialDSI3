<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Crear cuenta</h2>

          <form [formGroup]="form" (ngSubmit)="registrar()">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" id="username" class="form-control" formControlName="username">
              <small class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
                El usuario es obligatorio.
              </small>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" formControlName="password">
              <small class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                La contraseña debe tener mínimo 8 caracteres.
              </small>
            </div>

            <div class="mb-3">
              <label for="confirmar" class="form-label">Confirmar contraseña</label>
              <input type="password" id="confirmar" class="form-control" formControlName="confirmar">
              <small class="error" *ngIf="form.get('confirmar')?.invalid && form.get('confirmar')?.touched">
                Confirma la contraseña.
              </small>
            </div>

            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
          </form>

          <p class="text-center mt-3 mb-0">
            ¿Ya tienes cuenta? <a routerLink="/inicio">Inicia sesión</a>
          </p>

          <div *ngIf="mensaje" class="alert alert-danger mt-3 mb-0">{{ mensaje }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
