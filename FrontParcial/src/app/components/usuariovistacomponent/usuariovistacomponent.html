<div class="container py-5">
  <div class="row">


    <div class="col-12 col-lg-4 mb-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Comprar producto</h2>
          <div>

          </div>




            <button type="submit" class="btn btn-primary w-100">Comprar producto</button>


          <div *ngIf="mensaje" [ngClass]="exito ? 'alert-success' : 'alert-danger'" class="alert mt-3 mb-0">
            {{ mensaje }}
          </div>
        </div>
      </div>
    </div>


    <div class="col-12 col-lg-8">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="mb-4">Productos registrados ({{ productos.length }})</h2>

          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Disponible</th>
                <th>ID</th>
                <th>Tipo</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let p of productos">
                <td>{{ p.nombre }}</td>
                <td>{{ p.precio }}</td>
                <td>{{ p.stock }}</td>
                <td>{{ p.disponible ? 'Sí' : 'No' }}</td>
                <td>{{p.id}}</td>
                <td>{{p.tipo}}</td>
              </tr>
              </tbody>
            </table>
          </div>

          <a routerLink="/inicio" class="btn btn-outline-secondary mt-4">Volver</a>
        </div>
      </div>
    </div>

  </div>
</div>
