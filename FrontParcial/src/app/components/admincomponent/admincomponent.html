<div class="container py-4">
  <h2 class="mb-4">Panel de administración</h2>

  <div class="row g-4">


    <div class="col-12 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h5 class="mb-3">{{ editandoId === 0 ? 'Crear usuario' : 'Editar usuario #' + editandoId }}</h5>

          <form [formGroup]="form" (ngSubmit)="guardar()">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" id="username" class="form-control" formControlName="username">
              <small class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
                El usuario es obligatorio.
              </small>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" formControlName="password"
                     [placeholder]="editandoId === 0 ? '' : 'Vacía = no cambia'">
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Rol</label>
              <select id="role" class="form-select" formControlName="role">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              {{ editandoId === 0 ? 'Crear' : 'Guardar cambios' }}
            </button>
            <button type="button" class="btn btn-link w-100" *ngIf="editandoId !== 0" (click)="cancelar()">
              Cancelar
            </button>
          </form>

          <div *ngIf="mensaje" class="alert mt-3 mb-0" [class.alert-success]="exito" [class.alert-danger]="!exito">
            {{ mensaje }}
          </div>
        </div>
      </div>
    </div>


    <div class="col-12 col-lg-8">
      <div class="card shadow">
        <div class="card-body p-4">
          <h5 class="mb-3">Usuarios ({{ usuarios.length }})</h5>

          <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
              <th>Id</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let u of usuarios">
              <td>{{ u.id }}</td>
              <td>{{ u.username }}</td>
              <td>
                  <span class="badge" [class.bg-danger]="u.role === 'ADMIN'" [class.bg-secondary]="u.role !== 'ADMIN'">
                    {{ u.role }}
                  </span>
              </td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-2" (click)="editar(u)">Editar</button>
                <button class="btn btn-sm btn-outline-danger" (click)="eliminar(u)"
                        *ngIf="u.username !== service.leer('username')">Eliminar</button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
