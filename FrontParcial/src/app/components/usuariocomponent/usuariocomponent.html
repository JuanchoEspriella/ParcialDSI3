<div class="container py-4">
  <div class="card shadow">
    <div class="card-body p-4">
      <h2 class="mb-4">Productos registrados ({{ usuarios.length }})</h2>

      <table class="table table-hover mb-0">
        <thead>
        <tr>
          <th>Id</th>
          <th>Usuario</th>
          <th>Rol</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let u of usuarios">
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.role }}</td>
        </tr>
        </tbody>
      </table>

      <a routerLink="/inicio" class="btn btn-outline-secondary mt-4">Volver</a>
    </div>
  </div>
</div>
