<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Crear producto</h2>

          <form [formGroup]="form" (ngSubmit)="guardar()">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" class="form-control" formControlName="nombre">
              <small class="text-danger" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
                El nombre del producto es obligatorio.
              </small>
            </div>

            <div class="mb-3">
              <label for="stock" class="form-label">Stock</label>
              <input type="number" id="stock" class="form-control" formControlName="stock">
              <small class="text-danger" *ngIf="form.get('stock')?.invalid && form.get('stock')?.touched">
                Debe registrar un stock válido (mínimo 0).
              </small>
            </div>

            <div class="mb-3">
              <label for="precio" class="form-label">Precio</label>
              <input type="number" id="precio" class="form-control" formControlName="precio">
              <small class="text-danger" *ngIf="form.get('precio')?.invalid && form.get('precio')?.touched">
                El precio debe ser mayor o igual a 1.
              </small>
            </div>

            <div class="mb-3">
              <label for="fechaVencimiento" class="form-label">Fecha de vencimiento</label>
              <input type="date" id="fechaVencimiento" class="form-control" formControlName="fechaVencimiento">
              <small class="text-danger" *ngIf="form.get('fechaVencimiento')?.invalid && form.get('fechaVencimiento')?.touched">
                La fecha de vencimiento es obligatoria.
              </small>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" id="disponible" class="form-check-input" formControlName="disponible">
              <label for="disponible" class="form-check-label">Está disponible</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Crear producto</button>
          </form>


          <div *ngIf="mensaje" [ngClass]="exito ? 'alert-success' : 'alert-danger'" class="alert mt-3 mb-0">
            {{ mensaje }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
